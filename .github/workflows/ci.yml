name: ci

# CI runs on forcicd.g8.lo (Forgejo + act_runner) — not on GitHub Actions.
# We're conserving GitHub Actions bandwidth; forcicd is canonical for the
# CI loop. Every job below carries an `if: github.server_url !=
# 'https://github.com'` gate so the GitHub side records the workflow_run
# but skips every job (zero minutes consumed). The Forgejo mirror at
# http://forcicd.g8.lo:3000/ci/rspacefs runs everything normally.
#
# If you ever NEED GitHub-side CI (security audit, public PR verification,
# external contributor without LAN access), remove the gates or override
# via workflow_dispatch from the GitHub UI.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch / PR. Keeps the queue tight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: fmt
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.7.3
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    name: test (ubuntu-latest)
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.3
      - run: cargo test --workspace --all-targets

  # macOS proves the rspacefs-fuse stub-path still compiles on
  # non-Linux. forcicd doesn't ship a Mac runner image, and we've moved
  # CI off GH, so this is effectively disabled. Re-enable by removing
  # `false &&` if you want a macOS verification run via GH workflow_dispatch.
  test-macos:
    name: test (macos-latest)
    if: false && github.server_url == 'https://github.com'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.3
      - run: cargo test --workspace --all-targets

  build-linux:
    name: build linux release (${{ matrix.arch }})
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2.7.3
      - name: install cross linker for aarch64
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      - name: build rspacefs-mount + rspacefs
        run: |
          cargo build --release \
            --target ${{ matrix.arch }}-unknown-linux-gnu \
            -p rspacefs-fuse -p rspacefs-cli
          ls -la target/${{ matrix.arch }}-unknown-linux-gnu/release/rspacefs-mount target/${{ matrix.arch }}-unknown-linux-gnu/release/rspacefs
      # Artifacts go to forcicd's job-page log (no separate upload step
      # since actions/upload-artifact@v4 rejects Forgejo). For release
      # tags, release.yml's softprops/action-gh-release publishes to
      # GitHub Releases.

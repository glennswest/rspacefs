name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch / PR. Keeps the queue tight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  test-macos:
    name: test (macos-latest)
    # macOS proves the rspacefs-fuse stub-path still compiles on
    # non-Linux. Only github-hosted runners ship macOS — skip on Forgejo
    # mirrors / forcicd / any non-github CI so the run doesn't queue
    # forever waiting for a runner that doesn't exist.
    if: github.server_url == 'https://github.com'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  build-linux:
    name: build linux release (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: install cross linker for aarch64
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      - name: build rspacefs-mount + rspacefs
        run: |
          cargo build --release \
            --target ${{ matrix.arch }}-unknown-linux-gnu \
            -p rspacefs-fuse -p rspacefs-cli
          ls -la target/${{ matrix.arch }}-unknown-linux-gnu/release/rspacefs-mount target/${{ matrix.arch }}-unknown-linux-gnu/release/rspacefs
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rspacefs-${{ matrix.arch }}-linux
          path: |
            target/${{ matrix.arch }}-unknown-linux-gnu/release/rspacefs-mount
            target/${{ matrix.arch }}-unknown-linux-gnu/release/rspacefs
          if-no-files-found: error
          retention-days: 14

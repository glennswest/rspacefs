[workspace]
members = [
    "crates/rspacefs-core",
    "crates/rspacefs-verity",
    "crates/rspacefs-cli",
    "crates/rspacefs-fuse",
    "crates/rspacefs-bigbust",
    "crates/rspacefs-pvc",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Glenn West"]
license = "MIT"
repository = "https://github.com/glennswest/rspacefs"
rust-version = "1.75"
description = "Pure-Rust userspace LayerFS and dm-verity for container image rootfs. Mounts via FUSE; integrates with containers-storage as mount_program."

# Release-profile tuning. The mount daemon is hot — every container start
# on every cluster node exercises it. Squeeze fixed-overhead out at compile
# time before doing it at run time.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Profile for PGO-instrumented builds. Run an instrumented binary against
# a representative workload, collect profile data, then rebuild with
# RUSTFLAGS="-C profile-use=/path/to/merged.profdata" --profile=release.
[profile.release-pgo]
inherits = "release"

[workspace.dependencies]
vfs = "0.12"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
fuser = { version = "0.16", default-features = false, features = ["abi-7-40"] }
libc = "0.2"
xattr = "1.5"

[package]
name = "rspacefs-bigbust"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "K8s bigbust load driver for rspacefs — N parallel container runs across M images, talks directly to the apiserver via kube-rs."

[[bin]]
name = "rspacefs-bigbust"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
kube = { version = "0.96", default-features = false, features = ["client", "runtime", "rustls-tls"] }
k8s-openapi = { version = "0.23", features = ["latest"] }
futures = "0.3"
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true

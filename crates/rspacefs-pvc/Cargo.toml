[package]
name = "rspacefs-pvc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PVC primitives over rspacefs LayerFS: empty-lower mount, pivot-upper, capture-to-layer. Pure library — no FUSE, no IPC. Consumed by rspacefs-fuse (FUSE daemon), rspacefs-cli (offline tools), qregistry (registry inspection), and rspaced (boot agent)."

[dependencies]
rspacefs-core = { path = "../rspacefs-core" }
